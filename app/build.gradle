plugins {
    id 'com.android.application'
}

def signingPropertiesFile = rootProject.file('.signing/netwatch.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}
def environmentStoreFile = System.getenv('NETWATCH_STORE_FILE')
def releaseKeystoreFile = environmentStoreFile
        ? file(environmentStoreFile)
        : rootProject.file('.signing/netwatch.keystore')
def releaseStorePassword = System.getenv('NETWATCH_STORE_PASSWORD')
        ?: signingProperties.getProperty('storePassword')
def releaseKeyAlias = System.getenv('NETWATCH_KEY_ALIAS')
        ?: signingProperties.getProperty('keyAlias')
def releaseKeyPassword = System.getenv('NETWATCH_KEY_PASSWORD')
        ?: signingProperties.getProperty('keyPassword')
def hasReleaseSigning = releaseKeystoreFile.isFile()
        && releaseStorePassword
        && releaseKeyAlias
        && releaseKeyPassword

android {
    namespace 'dev.local.tailscalenetwatch'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.local.tailscalenetwatch'
        minSdk 29
        targetSdk 36
        versionCode 5
        versionName '2.1'
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
                enableV4Signing true
            }
        }
    }

    buildTypes {
        debug {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'androidx.annotation:annotation:1.10.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
}
